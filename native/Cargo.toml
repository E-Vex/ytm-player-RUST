[package]
name = "ytm_player_native"
version = "2.1.0"
edition = "2021"
# Minimum supported Rust toolchain — matches the requirement documented in
# README.md. Enforced by cargo when building with an older toolchain.
rust-version = "1.98"
description = "Native (Rust/PyO3) performance utilities for ytm-player"

[lib]
name = "ytm_player_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3", "extension-module"] }
once_cell = "1.20"
sha2 = "0.10"

[dependencies.regex]
version = "1.10"
default-features = false
features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"]

[dependencies.unicode-bidi]
version = "0.3"
default-features = false
features = ["std", "hardcoded-data"]

[dependencies.any_ascii]
version = "0.3"
