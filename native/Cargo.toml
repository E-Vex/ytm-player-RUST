[package]
name = "formatting_native"
version = "2.1.0"
edition = "2021"
description = "Native (Rust/PyO3) formatting utilities for ytm-player"

[lib]
name = "formatting_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3", "extension-module"] }
once_cell = "1.20"

[dependencies.regex]
version = "1.10"
default-features = false
features = ["std", "unicode-perl"]
