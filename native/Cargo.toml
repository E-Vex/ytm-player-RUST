[package]
name = "ytm_player_native"
version = "2.1.0"
edition = "2021"
description = "Native (Rust/PyO3) performance utilities for ytm-player"

[lib]
name = "ytm_player_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3", "extension-module"] }
once_cell = "1.20"

[dependencies.regex]
version = "1.10"
default-features = false
features = ["std", "unicode-perl", "unicode-case"]

[dependencies.unicode-bidi]
version = "0.3"
default-features = false
features = ["std", "hardcoded-data"]

[dependencies.any_ascii]
version = "0.3"
