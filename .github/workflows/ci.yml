name: CI

# Fork note (verified 2026-11-07): the branch filters below were never
# broken — the "aster, dev]" reading is a terminal display artifact
# (the `[m` pair renders as an ANSI reset and gets swallowed by cat /
# git log -p output). What IS true: push events have never started CI
# on this fork (every recorded run is a manual workflow_dispatch),
# while the same workflow triggers fine on the parent repo, and the
# suppression survives a valid filter, an active workflow state, an
# explicit enable call, and committing this file to the default
# branch — a server-side fork state, not a file problem. Until it is
# resolved (delete-all-runs + the fork's green "enable" button, or
# GitHub Support), workflow_dispatch below is the reliable trigger.
on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install ruff==0.15.1
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright src/ytm_player/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # dbus-fast (a Linux core dep) installs with .[dev] on ubuntu, giving the
      # #106 platform-guard test teeth: it proves the forced-win32/darwin import
      # never pulls dbus-fast in even when it's present. macOS/Windows runners
      # correctly never install it (sys_platform marker).
      - run: pytest --cov=ytm_player --cov-report=term-missing

  # Build the native Rust/PyO3 extension and run the test suite with it
  # loaded. Without this job every `skipif(not _HAVE_NATIVE)` parity test
  # silently skips and a commit that breaks the extension build — or makes a
  # native function diverge from its pure-Python fallback — still shows green.
  native:
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported Python range: 3.10 is the abi3 floor,
        # 3.15 exercises the PYO3_USE_ABI3_FORWARD_COMPATIBILITY path in
        # native/build.sh.
        python-version: ["3.10", "3.15"]
    runs-on: ubuntu-latest
    env:
      # pyo3 0.23 supports interpreters up to 3.13; the 3.15 leg needs
      # the abi3 forward-compatibility escape hatch. build.sh exports it
      # for the cargo build, but clippy's build-script pass runs before
      # it — set it for the whole job (inert on 3.10).
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # ubuntu-latest images ship rustup; install the stable toolchain with
      # the lint components explicitly so the job is independent of whatever
      # toolchain version happens to be preinstalled.
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: rustfmt
        run: cargo fmt --check
        working-directory: native
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: native
      - run: pip install -e ".[dev]"
      - name: Build extension
        run: ./build.sh
        working-directory: native
      - name: pytest with native extension
        run: pytest
