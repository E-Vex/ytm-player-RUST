name: CI

# Fork note (verified 2026-11-07): the branch filters below were never
# broken — the "aster, dev]" reading is a terminal display artifact
# (the `[m` pair renders as an ANSI reset and gets swallowed by cat /
# git log -p output). What IS true: push events have never started CI
# on this fork (every recorded run is a manual workflow_dispatch),
# while the same workflow triggers fine on the parent repo, and the
# suppression survives a valid filter, an active workflow state, an
# explicit enable call, and committing this file to the default
# branch — a server-side fork state, not a file problem. Until it is
# resolved (delete-all-runs + the fork's green "enable" button, or
# GitHub Support), workflow_dispatch below is the reliable trigger.
on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned to match publish.yml so CI proves the exact release toolchain;
  # bump both together.
  MATURIN_VERSION: "1.16.0"
  ZIGLANG_VERSION: "0.17.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
      - run: pip install ruff==0.15.1
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e ".[dev]"
      - run: .venv/bin/pyright src/ytm_player/

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      # dbus-fast (a Linux core dep) installs with .[dev] on ubuntu, giving the
      # #106 platform-guard test teeth: it proves the forced-win32/darwin import
      # never pulls dbus-fast in even when it's present. macOS/Windows runners
      # correctly never install it (sys_platform marker).
      - run: pytest --cov=ytm_player --cov-report=term-missing

  # Build the native Rust/PyO3 extension and run the test suite with it
  # loaded. Without this job every `skipif(not _HAVE_NATIVE)` parity test
  # silently skips and a commit that breaks the extension build — or makes a
  # native function diverge from its pure-Python fallback — still shows green.
  native:
    strategy:
      fail-fast: false
      matrix:
        # Every supported OS: the extension is a per-platform artifact
        # (.abi3.so from a .so on Linux and a .dylib on macOS, .pyd from a
        # .dll on Windows), so the build itself and the native-parity test
        # legs must run everywhere the app ships — a platform-specific
        # regression would otherwise only surface as a silent fallback on
        # the OSes this job skipped.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Both ends of the supported Python range: 3.10 is the abi3 floor,
        # 3.15 exercises the PYO3_USE_ABI3_FORWARD_COMPATIBILITY path in
        # native/build.sh.
        python-version: ["3.10", "3.15"]
    runs-on: ${{ matrix.os }}
    env:
      # pyo3 0.23 supports interpreters up to 3.13; the 3.15 leg needs
      # the abi3 forward-compatibility escape hatch. build.sh exports it
      # for the cargo build, but clippy's build-script pass runs before
      # it — set it for the whole job (inert on 3.10).
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The GitHub runner images (ubuntu, macos, windows) all ship rustup;
      # install the stable toolchain with the lint components explicitly so
      # the job is independent of whatever toolchain version happens to be
      # preinstalled.
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: rustfmt
        run: cargo fmt --check
        working-directory: native
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: native
      - run: pip install -e ".[dev]"
      - name: Build extension
        run: ./build.sh
        working-directory: native
      - name: pytest with native extension
        run: pytest

  # Prove the published binary wheels on every push, not only at release
  # time: each leg builds the maturin wheel exactly the way publish.yml
  # does (same pinned maturin, same zig-linked manylinux targets) and
  # verifies tags, payload and — wherever the runner can install the
  # wheel — that the extension actually loads from it. A maturin or
  # pyproject [tool.maturin] regression would otherwise only surface when
  # a release tag is pushed.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux-x86_64
            os: ubuntu-latest
            rustup-targets: "x86_64-unknown-linux-gnu"
            maturin-target: "x86_64-unknown-linux-gnu"
            zig: true
            platform-tag: "manylinux2014_x86_64.manylinux_2_17_x86_64"
            arch-check: "--elf-machine 62"
            smoke: true
          - name: manylinux-aarch64
            os: ubuntu-latest
            rustup-targets: "aarch64-unknown-linux-gnu"
            maturin-target: "aarch64-unknown-linux-gnu"
            zig: true
            platform-tag: "manylinux2014_aarch64.manylinux_2_17_aarch64"
            arch-check: "--elf-machine 183"
          - name: macos-universal2
            os: macos-latest
            rustup-targets: "aarch64-apple-darwin x86_64-apple-darwin"
            maturin-target: "universal2-apple-darwin"
            # maturin (cargo-zigbuild) tags the fat wheel with every macOS
            # platform it satisfies — arm64, universal2 and x86_64 — as a
            # compressed PEP 425 tag set (mirrors publish.yml).
            platform-tag: "macosx_11_0_arm64.macosx_11_0_universal2.macosx_11_0_x86_64"
            arch-check: "--macho-universal2"
            smoke: true
          - name: windows-amd64
            os: windows-latest
            platform-tag: "win_amd64"
            arch-check: "--pe-machine 0x8664"
            smoke: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # The abi3 floor: the wheels claim cp310-abi3, so build and
          # smoke-test on the oldest supported interpreter.
          python-version: "3.10"
          cache: pip
      - run: rustup toolchain install stable --profile minimal
      - name: Add Rust cross-targets
        if: matrix.rustup-targets
        run: rustup target add ${{ matrix.rustup-targets }}
      - name: Install maturin (and zig for the manylinux legs)
        run: |
          pip install "maturin==$MATURIN_VERSION"
          if [ "$ZIG" = "true" ]; then
            pip install "ziglang==$ZIGLANG_VERSION"
          fi
        env:
          ZIG: ${{ matrix.zig }}
      - name: Build wheel with maturin
        run: |
          MATURIN_ARGS=()
          if [ -n "$TARGET" ]; then
            MATURIN_ARGS+=(--target "$TARGET")
          fi
          if [ "$ZIG" = "true" ]; then
            MATURIN_ARGS+=(--zig)
          fi
          maturin build --release --locked \
            --manifest-path native/Cargo.toml \
            --out dist \
            "${MATURIN_ARGS[@]}"
        env:
          TARGET: ${{ matrix.maturin-target }}
          ZIG: ${{ matrix.zig }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Verify wheel tagging and payload
        run: |
          python .github/scripts/check_native_wheel.py dist/*.whl \
            --python-tag cp310 --abi-tag abi3 \
            --platform-tag "$PLATFORM_TAG" \
            $ARCH_CHECK
        env:
          PLATFORM_TAG: ${{ matrix.platform-tag }}
          ARCH_CHECK: ${{ matrix.arch-check }}
      - name: Smoke-test the wheel
        if: matrix.smoke
        run: |
          python -m venv /tmp/smoke
          SMOKE_PY=/tmp/smoke/bin/python
          if [ -f /tmp/smoke/Scripts/python.exe ]; then
            SMOKE_PY=/tmp/smoke/Scripts/python.exe
          fi
          "$SMOKE_PY" -m pip install dist/*.whl
          "$SMOKE_PY" -m ytm_player --version
          "$SMOKE_PY" - <<'PY'
          from ytm_player import __version__
          from ytm_player.utils import _ytm_player_native
          import importlib.metadata

          exports = [name for name in dir(_ytm_player_native) if not name.startswith("_")]
          assert exports, "extension module loaded but exports nothing"
          assert importlib.metadata.version("ytm-player") == __version__, (
              f"wheel version {importlib.metadata.version('ytm-player')!r} "
              f"!= __version__ {__version__!r}"
          )
          print(f"native extension loads from the wheel: {len(exports)} exports, version {__version__}")
          PY
